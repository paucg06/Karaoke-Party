<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eterno Karaoke</title>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/game.css">
</head>
<body>

  <!-- 1. VISTA: MENÚ PRINCIPAL (CUADRÍCULA LIPS / VOCALUXE) -->
  <main id="view-library"></main>

  <!-- 2. VISTA: PANTALLA DE JUEGO (CANVAS + HUD HASTA 4 JUGADORES) -->
  <section id="view-game" class="game-viewport hidden">
    <!-- Vídeo MP4 de fondo del videoclip -->
    <video id="bg-video" class="bg-video" playsinline></video>

    <!-- Canvas de notas píldora a 60 FPS -->
    <canvas id="game-canvas" class="game-canvas"></canvas>

    <!-- HUD Superior Dinámico (1 a 4 Jugadores) -->
    <header class="game-hud">
      <div id="hud-players-row" class="hud-players-row"></div>

      <div class="hud-center-controls">
        <div class="song-meta-pill">
          <span id="hud-song-title" class="meta-title">-</span>
          <span class="meta-separator">•</span>
          <span id="hud-song-artist" class="meta-artist">-</span>
        </div>
        <div class="hud-action-buttons">
          <button id="btn-pause" class="btn-hud-circle" title="Pausar juego">
            <img src="src/assets/images/svg/pause.svg" alt="Pausa" />
          </button>
          <button id="btn-back" class="btn-hud-circle" title="Salir a biblioteca">
            <img src="src/assets/images/svg/arrow-left.svg" alt="Salir" />
          </button>
        </div>
      </div>
    </header>
  </section>

  <!-- 3. MODAL: RESULTADOS FINALES MULTI-JUGADOR -->
  <aside id="view-results" class="modal-overlay hidden">
    <div class="results-card-large">
      <header class="results-banner">
        <img src="src/assets/images/svg/trophy.svg" alt="Trofeo" class="trophy-icon" />
        <h2 id="res-winner-title" class="winner-title">CANCION COMPLETADA</h2>
      </header>

      <div id="results-players-container" class="results-grid"></div>

      <footer class="results-footer">
        <button id="btn-retry" class="btn-result primary">Cantar de Nuevo</button>
        <button id="btn-exit-results" class="btn-result secondary">Volver al Menú</button>
      </footer>
    </div>
  </aside>

  <!-- Script Principal Modular -->
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
