<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Micrófono Karaoke</title>
  <script src="src/js/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070B14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }
    .mic-card {
      background-color: #0F172A;
      border: 2px solid #1E293B;
      border-radius: 16px;
      padding: 28px 22px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }
    .mic-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .mic-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      background-color: #070B14;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      color: #FFFFFF;
      font-size: 16px;
      outline: none;
    }
    .avatar-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .avatar-btn {
      background-color: #1E293B;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
    }
    .avatar-btn.selected {
      border-color: #38BDF8;
      background-color: #1E3A8A;
    }
    .avatar-btn img {
      width: 44px;
      height: 44px;
      display: block;
    }
    .btn-connect {
      width: 100%;
      padding: 16px;
      background-color: #2563EB;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-connect:hover {
      background-color: #1D4ED8;
    }

    /* Connected Screen */
    .connected-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      background-color: #10B981;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .status-badge.muted {
      background-color: #EF4444;
    }
    .player-tag {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .player-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .vu-meter-wrap {
      width: 100%;
      height: 20px;
      background-color: #070B14;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid #1E293B;
    }
    .vu-meter-fill {
      width: 0%;
      height: 100%;
      background-color: #38BDF8;
      transition: width 0.05s ease;
    }
    .pitch-reading {
      font-size: 14px;
      color: #94A3B8;
      font-weight: 700;
      min-height: 20px;
    }

    /* Mute Button (Discrete, protected against accidental tap) */
    .mute-box {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
    .btn-mute {
      background-color: #1E293B;
      border: 1px solid #334155;
      color: #94A3B8;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn-mute.is-muted {
      background-color: #7F1D1D;
      border-color: #EF4444;
      color: #F87171;
    }

    /* Ready Check Modal */
    .ready-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(7, 11, 20, 0.96);
      border-radius: 14px;
      padding: 24px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .ready-song-title {
      font-size: 18px;
      font-weight: 800;
      color: #F8FAFC;
      margin-bottom: 4px;
    }
    .ready-prompt {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .btn-ready-confirm {
      width: 100%;
      padding: 16px;
      background-color: #10B981;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-ready-confirm.confirmed {
      background-color: #1E293B;
      color: #38BDF8;
      border: 1px solid #38BDF8;
    }
    .btn-disconnect {
      margin-top: 24px;
      background: transparent;
      border: 1px solid #334155;
      color: #94A3B8;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Card de Registro / Conexión -->
  <div id="join-card" class="mic-card">
    <h1 class="mic-title">CONECTAR MICRÓFONO</h1>
    <p class="mic-sub">Únete a la sala de karaoke con tu móvil</p>

    <div class="form-group">
      <label for="player-name">Tu Nombre</label>
      <input type="text" id="player-name" placeholder="Escribe tu nombre..." maxlength="12" />
    </div>

    <div class="form-group">
      <label>Elige tu Avatar y Color</label>
      <div class="avatar-grid">
        <button class="avatar-btn selected" data-avatar="avatar-1" data-color="#2563EB">
          <img src="src/assets/images/svg/avatar-1.svg" alt="P1" />
        </button>
        <button class="avatar-btn" data-avatar="avatar-2" data-color="#EF4444">
          <img src="src/assets/images/svg/avatar-2.svg" alt="P2" />
        </button>
        <button class="avatar-btn" data-avatar="avatar-3" data-color="#10B981">
          <img src="src/assets/images/svg/avatar-3.svg" alt="P3" />
        </button>
        <button class="avatar-btn" data-avatar="avatar-4" data-color="#F59E0B">
          <img src="src/assets/images/svg/avatar-4.svg" alt="P4" />
        </button>
      </div>
    </div>

    <button id="btn-join" class="btn-connect">ENTRAR A LA SALA</button>
  </div>

  <!-- Vista Conectada y Transmitiendo -->
  <div id="active-card" class="mic-card connected-view">
    <span id="badge-status" class="status-badge">CONECTADO</span>
    <h2 id="disp-name" class="player-tag">Nombre</h2>
    <p id="disp-slot" class="player-sub">Micrófono en Vivo</p>

    <div class="vu-meter-wrap">
      <div id="vu-fill" class="vu-meter-fill"></div>
    </div>
    <span id="disp-pitch" class="pitch-reading">Esperando voz...</span>

    <!-- Silenciar Micrófono -->
    <div class="mute-box">
      <button id="btn-mute" class="btn-mute">
        <span id="mute-label">Silenciar Micrófono</span>
      </button>
    </div>

    <button id="btn-leave" class="btn-disconnect">Desconectar</button>

    <!-- Overlay Ready Check "¿Estás Listo?" -->
    <div id="ready-overlay" class="ready-overlay">
      <h3 id="ready-song-name" class="ready-song-title">Canción</h3>
      <p class="ready-prompt">¿Estás listo para cantar?</p>
      <button id="btn-ready-action" class="btn-ready-confirm">¡ESTOY LISTO!</button>
    </div>
  </div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'karaoke-party-paucg06';

    let peer = null;
    let dataConn = null;
    let broadcastChan = null;
    let audioCtx = null;
    let analyser = null;
    let mediaStream = null;
    let buffer = null;
    let isBroadcasting = false;
    let isMuted = false;
    let myPlayerId = 'p_' + Math.random().toString(36).substring(2, 8);
    let myPlayerName = 'Cantante';
    let selectedAvatar = 'avatar-1';
    let selectedColor = '#2563EB';

    try {
      broadcastChan = new BroadcastChannel('karaoke_room_sync');
      broadcastChan.onmessage = (e) => handleHostMessage(e.data);
    } catch(e) {}

    // Avatar selector
    document.querySelectorAll('.avatar-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedAvatar = btn.dataset.avatar;
        selectedColor = btn.dataset.color;
      });
    });

    const btnJoin = document.getElementById('btn-join');
    const btnLeave = document.getElementById('btn-leave');
    const btnMute = document.getElementById('btn-mute');
    const muteLabel = document.getElementById('mute-label');
    const nameInput = document.getElementById('player-name');
    const vuFill = document.getElementById('vu-fill');
    const dispPitch = document.getElementById('disp-pitch');
    const badgeStatus = document.getElementById('badge-status');

    const readyOverlay = document.getElementById('ready-overlay');
    const readySongName = document.getElementById('ready-song-name');
    const btnReadyAction = document.getElementById('btn-ready-action');

    btnJoin.addEventListener('click', async () => {
      myPlayerName = nameInput.value.trim() || 'Cantante';

      try {
        await startMicrophone();
      } catch (err) {
        alert('Debes permitir el acceso al micrófono en el navegador: ' + err.message);
        return;
      }

      connectToHost(myPlayerName);

      document.getElementById('join-card').style.display = 'none';
      document.getElementById('active-card').style.display = 'flex';
      document.getElementById('disp-name').textContent = myPlayerName;
      document.getElementById('disp-name').style.color = selectedColor;

      startPitchLoop(myPlayerName);
    });

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      btnMute.classList.toggle('is-muted', isMuted);
      badgeStatus.classList.toggle('muted', isMuted);
      badgeStatus.textContent = isMuted ? 'SILENCIADO' : 'CONECTADO';
      muteLabel.textContent = isMuted ? '✓ Micrófono Silenciado' : 'Silenciar Micrófono';
      if (isMuted) {
        vuFill.style.width = '0%';
        dispPitch.textContent = 'Micrófono apagado';
      }
    });

    btnReadyAction.addEventListener('click', () => {
      btnReadyAction.classList.add('confirmed');
      btnReadyAction.textContent = '✓ ¡LISTO! ESPERANDO AL HOST...';
      sendData({
        type: 'player_ready',
        id: myPlayerId
      });
    });

    btnLeave.addEventListener('click', () => {
      stopMicrophone();
      sendData({ type: 'player_leave', id: myPlayerId });
      if (dataConn) dataConn.close();
      if (peer) peer.destroy();
      document.getElementById('active-card').style.display = 'none';
      document.getElementById('join-card').style.display = 'block';
    });

    function connectToHost(name) {
      if (typeof window.Peer === 'undefined') {
        sendData({
          type: 'player_join',
          id: myPlayerId,
          name: name,
          avatar: selectedAvatar,
          color: selectedColor
        });
        return;
      }

      try {
        peer = new window.Peer({ debug: 1 });
        peer.on('open', (id) => {
          dataConn = peer.connect(roomId, { reliable: true });

          dataConn.on('open', () => {
            console.log('[Móvil] Conectado al Host WebRTC');
            sendData({
              type: 'player_join',
              id: myPlayerId,
              name: name,
              avatar: selectedAvatar,
              color: selectedColor
            });
          });

          dataConn.on('data', (data) => {
            handleHostMessage(data);
          });
        });
      } catch (err) {
        console.warn('[Móvil] Error PeerJS:', err);
      }
    }

    function handleHostMessage(msg) {
      if (!msg) return;
      if (msg.type === 'ready_check_start') {
        readySongName.textContent = msg.songTitle || 'Canción';
        btnReadyAction.classList.remove('confirmed');
        btnReadyAction.textContent = '¡ESTOY LISTO!';
        readyOverlay.style.display = 'flex';
      } else if (msg.type === 'game_started' || msg.type === 'ready_check_cancel') {
        readyOverlay.style.display = 'none';
      }
    }

    async function startMicrophone() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      const source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      buffer = new Float32Array(analyser.fftSize);
      isBroadcasting = true;

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    function stopMicrophone() {
      isBroadcasting = false;
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    function startPitchLoop(name) {
      let lastSentTime = 0;

      const tick = () => {
        if (!isBroadcasting || !analyser) return;

        if (isMuted) {
          sendData({
            type: 'player_pitch',
            id: myPlayerId,
            pitch: null,
            volume: 0,
            isSinging: false
          });
          requestAnimationFrame(tick);
          return;
        }

        analyser.getFloatTimeDomainData(buffer);

        let sumSq = 0;
        for (let i = 0; i < buffer.length; i++) sumSq += buffer[i] * buffer[i];
        const rms = Math.sqrt(sumSq / buffer.length);
        const vol = Math.min(1, rms * 8);

        vuFill.style.width = Math.round(vol * 100) + '%';

        let detectedPitch = null;
        let isSinging = false;

        if (rms > 0.015) {
          const freq = detectFrequency(buffer, audioCtx.sampleRate);
          if (freq >= 70 && freq <= 1100) {
            detectedPitch = 69 + 12 * Math.log2(freq / 440) - 60;
            isSinging = true;
            dispPitch.textContent = `Afinando: ${Math.round(freq)} Hz`;
          } else {
            dispPitch.textContent = 'Voz fuera de escala';
          }
        } else {
          dispPitch.textContent = 'Silencio...';
        }

        const now = Date.now();
        if (now - lastSentTime > 33) {
          sendData({
            type: 'player_pitch',
            id: myPlayerId,
            name: name,
            pitch: detectedPitch,
            volume: vol,
            isSinging: isSinging
          });
          lastSentTime = now;
        }

        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function sendData(msg) {
      if (dataConn && dataConn.open) {
        dataConn.send(msg);
      }
      if (broadcastChan) {
        broadcastChan.postMessage(msg);
      }
    }

    function detectFrequency(buf, sampleRate) {
      const size = buf.length;
      const maxLag = Math.floor(sampleRate / 70);
      const minLag = Math.floor(sampleRate / 1100);

      let maxCorr = 0;
      let bestLag = -1;
      let sumSq = 0;
      for (let i = 0; i < size; i++) sumSq += buf[i] * buf[i];
      if (sumSq < 0.0001) return -1;

      for (let lag = minLag; lag <= maxLag; lag++) {
        let corr = 0;
        for (let i = 0; i < size - lag; i++) corr += buf[i] * buf[i + lag];
        corr /= sumSq;
        if (corr > maxCorr) {
          maxCorr = corr;
          bestLag = lag;
        }
      }

      if (maxCorr > 0.45 && bestLag > 0) {
        return sampleRate / bestLag;
      }
      return -1;
    }
  </script>
</body>
</html>
